<!DOCTYPE html>
<html>
<head>
    <title>Adesso Document Analyzer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }
        .container {
            display: flex;
            height: 100vh;
            gap: 24px;
            padding: 24px;
        }
        .panel {
            flex: 1;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
        }
        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1a9b71;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1a9b71;
            margin-bottom: 40px;
        }
        button {
            background: #1a9b71;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
        }
        button:hover { background: #158d63; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-top: 8px;
        }
        .item {
            padding: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 4px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <div class="logo">adesso</div>
            <h2>📋 Requirements</h2>
            <input type="text" placeholder="Filter...">
            <div class="item">Sample requirement 1</div>
            <div class="item">Sample requirement 2</div>
            <button>Upload</button>
        </div>
        
        <div class="panel">
            <h2>👥 Candidates</h2>
            <input type="text" placeholder="Filter...">
            <div class="item">Sample candidate 1</div>
            <div class="item">Sample candidate 2</div>
            <button>Upload</button>
        </div>
        
        <div class="panel" style="flex: 0.4;">
            <h2>🟢 System Status</h2>
            <div style="font-size: 12px; line-height: 1.8;">
                <div><strong>Backend:</strong> Running</div>
                <div><strong>Database:</strong> Connected</div>
                <div><strong>Vector Store:</strong> Ready</div>
                <div><strong>LLM:</strong> Online</div>
            </div>
            <button style="width: 100%; margin-top: 20px;">Start Chat</button>
        </div>
    </div>

    <script>
        console.log('Adesso Document Analyzer loaded');
        fetch('http://localhost:8080/api/documents/list')
            .then(r => r.json())
            .then(d => console.log('Backend response:', d))
            .catch(e => console.log('Backend status:', e.message));
    </script>
</body>
</html>
